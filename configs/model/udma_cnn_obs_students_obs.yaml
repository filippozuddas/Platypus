# UDMA model config — distilled CNN teacher AND both students confined to one
# observation ("cnn_obs_students_obs", phase 06a, 2026-11-26).
#
# Same teacher files as udma_cnn_obs.yaml (TeacherCNN distilled per
# observation from a frozen ImageNet ResNet-18, and its norm stats); the only
# change from that config is student.per_observation: true. Each student then
# runs trunk, memory and head on one 16 x 1024 observation at a time, so in
# eval mode no row of the anomaly map can depend on another observation's
# pixels: an ON-only signal cannot raise an OFF row of the map.
#
# Why: with whole-frame students and a confined teacher (udma_cnn_obs.yaml),
# the students' OFF rows move under an ON-only injection while the teacher's
# stay still, so st1/st2 carry the leak into the map (Voyager step failed,
# ON-only map test confirmed it). The reference (udma_nightsplit.yaml) hides
# the same student leak because its whole-frame ViT teacher moves with it.
#
# Comparisons: one variable against udma_cnn_obs.yaml (the students' scope);
# two against the reference (teacher and students' scope), so a result
# against the reference is a comparison of models, not of teachers.

architecture: udma

# --- Teacher (frozen, distilled, per observation) --- identical to udma_cnn_obs.yaml
teacher:
  type: cnn_distilled
  checkpoint: outputs/udma_teacher_distill/cnn_obs_resnet18_nightsplit.pt
  norm_stats: outputs/udma_teacher_norm/cnn_obs_nightsplit.pt

# --- Students (from-scratch trunk, Q3), per observation ---
# n_obs is taken from the confined teacher. The checkpoint carries a
# per_observation_n_obs buffer, so loading it under a whole-frame config (or a
# whole-frame checkpoint under this one) fails instead of loading silently.
student:
  per_observation: true
  encoder:
    filters: [32, 64, 128, 256]
    convs_per_block: 2
    kernel_size: [3, 3]
    activation: relu
    use_batchnorm: true
  bottleneck:
    latent_dim: 64
  head_hidden: 128
  head_context_convs: 2
  mem_slots: 500
  shrink_threshold: 0.002

# --- Loss (Q4) --- identical to udma_cnn_obs.yaml
loss:
  lambda1: 1.0
  lambda2: 1.0
  lambda3: 1.0
  entropy_weight: 2.0e-4

# --- Scoring (Q5) --- identical to udma_cnn_obs.yaml
scoring:
  weights: [0.5, 0.5, 0.5]
  topk_frac: 0.01
