# UDMA model config — reference model for the observing-night split (2026-10-12).
#
# Same teacher and student architecture as the 20260707_093113_6d0d1ba run
# (udma_old_teacher.yaml). Only teacher.norm_stats differs: the per-channel
# teacher statistics are learned from data, so they are refit on the new
# training nights only (scripts/fit_udma_teacher_norm.py) — the 2026-07-07 fit
# saw nights that are now in the final reserve.
#
# Teacher provenance: ViT-MAE trained on SRT data, weights written before the
# Exotica 0000 files reached the server (see the 2026-10-12 provenance notes).

architecture: udma

teacher:
  checkpoint: outputs/training/20260624_084754_057f87c/checkpoints/epoch=006-val_loss=2.1715.ckpt
  vit_config: configs/model/vit_mae.yaml
  teacher_layer: 3
  norm_stats: outputs/udma_teacher_norm/gbt_fine_nightsplit_block3.pt

student:
  encoder:
    filters: [32, 64, 128, 256]
    convs_per_block: 2
    kernel_size: [3, 3]
    activation: relu
    use_batchnorm: true
  bottleneck:
    latent_dim: 64
  head_hidden: 128
  head_context_convs: 2
  mem_slots: 500
  shrink_threshold: 0.002

loss:
  lambda1: 1.0
  lambda2: 1.0
  lambda3: 1.0
  entropy_weight: 2.0e-4

scoring:
  weights: [0.5, 0.5, 0.5]
  topk_frac: 0.01
